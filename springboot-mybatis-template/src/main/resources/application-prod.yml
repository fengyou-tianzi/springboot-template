# ======================== 生产环境配置 ========================

spring:
  # ==================== 数据源配置 ====================
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://prod-mysql-host:3306/template_db?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    druid:
      initial-size: 10
      min-idle: 10
      max-active: 50
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      # 生产环境关闭 SQL 监控
      filter:
        stat:
          enabled: false
      stat-view-servlet:
        enabled: false
      web-stat-filter:
        enabled: false

# ==================== MyBatis 生产环境覆盖 ====================
mybatis:
  configuration:
    # 生产环境关闭 SQL 日志
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# ==================== 日志级别 ====================
logging:
  level:
    root: warn
    com.example.template.mapper: warn
