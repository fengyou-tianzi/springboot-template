# ======================== 开发环境配置 ========================

spring:
  # ==================== 数据源配置 ====================
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/template_db?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root

    # ==================== Druid 连接池 ====================
    druid:
      # 初始连接数
      initial-size: 5
      # 最小空闲连接数
      min-idle: 5
      # 最大活跃连接数
      max-active: 20
      # 获取连接等待超时时间 (毫秒)
      max-wait: 60000
      # 连接有效性检测间隔 (毫秒)
      time-between-eviction-runs-millis: 60000
      # 连接最小生存时间 (毫秒)
      min-evictable-idle-time-millis: 300000
      # 检测连接是否有效的 SQL
      validation-query: SELECT 1
      # 申请连接时检测有效性
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      # 开启 SQL 监控 (生产环境关闭)
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 2000
      # Druid 监控页面
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
